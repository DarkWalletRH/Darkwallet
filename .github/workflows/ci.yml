name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # package-lock.json pins the SDK to a commit of its public repository; npm ci installs exactly
      # that and builds it with the SDK's own prepare script, as in the README's quick start.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
