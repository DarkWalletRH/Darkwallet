name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No lockfile is committed: the SDK is installed from a tag of its public repository and built
      # by its own prepare script, as in the README's quick start.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
