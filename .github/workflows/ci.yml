name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # package-lock.json pins the SDK to a commit of its public repository; npm ci installs exactly
      # that and builds it with the SDK's own prepare script, as in the README's quick start.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
